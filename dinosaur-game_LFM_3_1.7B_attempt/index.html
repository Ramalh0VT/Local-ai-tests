<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dinosaur Game – Replica</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background:#f0f4f8;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            margin:0;
        }
        h1 { color:#2c3e50; margin-bottom:1rem; }
        #scoreBoard {
            margin-top:1rem;
            font-size:1.5rem;
            color:#27ae60;
        }
        canvas {
            border:1px solid #ccc;
            background:#fff;
        }
    </style>
</head>
<body>

<h1>🦖 Dinosaur Hunt</h1>
<div id="scoreBoard">Score: 0</div>
<canvas id="game" width="400" height="200"></canvas>

<script>
    // ---------- Configuration ----------
    const CANVAS = document.getElementById('game');
    const ctx = CANVAS.getContext('2d');

    const COLS = 20;      // number of columns
    const ROWS = 20;      // number of rows
    const CELL_SIZE = 20; // each cell = 20px (400/COLS)

    // Player stats
    let playerX = 10 * CELL_SIZE; // start middle horizontally
    let playerY = 10 * CELL_SIZE; // start middle vertically
    let direction = 1; // 1 = right, -1 = left, 0 = down, -2 = up (we'll 
handle separately)
    let speed = 1;

    // Score & lives
    let score = 0;
    let lives = 3; // three attempts before game over

    // Generate initial obstacles (randomly placed, not on player)
    function initObstacles() {
        const obstacles = [];
        while (obstacles.length < 15) {
            const ox = Math.floor(Math.random() * COLS);
            const oy = Math.floor(Math.random() * ROWS);
            // ensure not same cell as player
            while (ox === playerX / CELL_SIZE && oy === playerY / 
CELL_SIZE) {
                ox = Math.floor(Math.random() * COLS);
                oy = Math.floor(Math.random() * ROWS);
            }
            obstacles.push({x: ox * CELL_SIZE, y: oy * CELL_SIZE});
        }
        return obstacles;
    }

    const obstacles = initObstacles();

    // ---------- Event Listeners ----------
    document.addEventListener('keydown', e => {
        switch(e.key.toLowerCase()) {
            case 'arrowleft':
                direction = -1;
                break;
            case 'arrowright':
                direction = 1;
                break;
            case 'arrowup':
                // up will set direction = -2 (move upward)
                direction = -2;
                break;
            case 'arrowdown':
                direction = 2;
                break;
            default:
                // ignore other keys
        }
    });

    // Prevent scrolling on arrow keys
    document.addEventListener('keyup', e => {
        
if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.target.tagNaif(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.targt.tagName)) {
            document.body.style.cursor = '';
        }
    });

    // ---------- Main Loop ----------
    let lastTime = 0;
    function updateGame() {
        // Move player
        let nextX = playerX + playerX * direction * speed; // wrong 
formula, fix below
        // Actually we want to move by one cell per tick, not multiply.
        // Let's redo: playerX += direction * speed * CELL_SIZE? No, 
simpler:
        // Each tick we move ONE cell in chosen direction.
        // We'll store dx/dy based on direction.
        // Direction mapping:
        // 1 -> right (+1)
        // -1 -> left (-1)
        // 2 -> down (+1 row)
        // -2 -> up (-1 row)
        // So:
        if (direction === 1 || direction === -1) {
            playerX += direction * CELL_SIZE;
        } else if (direction === 2 || direction === -2) {
            playerY += direction * CELL_SIZE;
        }

        // Boundary checks
        if (playerX <= 0) playerX = 0;
        if (playerX >= COLS * CELL_SIZE) playerX = COLS * CELL_SIZE;
        if (playerY <= 0) playerY = 0;
        if (playerY >= ROWS * CELL_SIZE) playerY = ROWS * CELL_SIZE;

        // Collision with walls → reverse direction
        if (playerX <= 0 || playerX >= COLS * CELL_SIZE || playerY <= 0 || 
playerY >= ROWS * CELL_SIZE) {
            // Reverse direction
            if (direction === 1) direction = -1;
            else if (direction === -1) direction = 1;
            else if (direction === 2) direction = -2;
            else if (direction === -2) direction = 2;
        }

        // Check collision with obstacles
        let hitObstacle = false;
        for (const obs of obstacles) {
            if (obs.x === playerX && obs.y === playerY) {
                hitObstacle = true;
                break;
            }
        }

        if (hitObstacle) {
            // Lose a life
            lives--;
            if (lives <= 0) {
                // Game Over
                alert('Game Over! Final score: ' + score);
                // Reset everything to start screen
                playerX = 10 * CELL_SIZE;
                playerY = 10 * CELL_SIZE;
                direction = 1;
                speed = 1;
                obstacles = [];
                score = 0;
                lives = 3;
                // Show result
                document.getElementById('scoreBoard').textContent = 'Final 
Score: ' + score;
                // Optionally stop animation
                clearInterval(updateGame); // no further updates
                return;
            }
            // Restart after losing a life
            obstacles = [];
            initObstacles();
            playerX = 10 * CELL_SIZE;
            playerY = 10 * CELL_SIZE;
            direction = 1;
            speed = 1;
        }

        // Draw current state
        ctx.clearRect(0, 0, CANVAS.width, CANVAS.height);
        // Draw grid lines (optional)
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 1;
        for (let i = 0; i <= COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CELL_SIZE, 0);
            ctx.lineTo(i * CELL_SIZE, CANVAS.height);
            ctx.stroke();
        }
        for (let j = 0; j <= ROWS; j++) {
            ctx.beginPath();
            ctx.moveTo(0, j * CELL_SIZE);
            ctx.lineTo(CANVAS.width, j * CELL_SIZE);
            ctx.stroke();
        }
        // Draw player
        ctx.fillStyle = '#e74c3c'; // dino color
        ctx.fillRect(playerX, playerY, CELL_SIZE, CELL_SIZE);
        // Draw obstacles
        ctx.fillStyle = '#f39c12';
        for (const obs of obstacles) {
            ctx.fillRect(obs.x, obs.y, CELL_SIZE, CELL_SIZE);
        }
        // Draw score
        ctx.fillText(score, 10, 30);
    }

    // ---------- Input handling ----------
    function loop() {
        updateGame();
        requestAnimationFrame(loop);
    }
    loop();

    // ---------- Initial draw ----------
    // One-time drawing of starting player and obstacles
    ctx.clearRect(0, 0, CANVAS.width, CANVAS.height);
    // Starting player
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(10*CELL_SIZE, 10*CELL_SIZE, CELL_SIZE, CELL_SIZE);
    // Obstacles
    for (const obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, CELL_SIZE, CELL_SIZE);
    }
    // Score label
    ctx.fillText("Score: " + score, 10, 30);
    requestAnimationFrame(loop);
</script>

</body>
</html>
